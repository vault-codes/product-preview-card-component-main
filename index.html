<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link href="./style.css" rel="stylesheet" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,700;1,9..144,700&display=swap" rel="stylesheet">
  
  <title>Frontend Mentor | Product preview card component</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    .attribution { font-size: 0.6875rem; text-align: center; }
    .attribution a { color: hsl(228, 45%, 44%); }
  </style>
</head>
<body>

  <main class="container">


  <div class="product-card"> 


  
      <div class="section-image">
            <img src="./images/image-product-mobile.jpg"  class="product-image" alt="image of the chanel product displaying"/>
         </div>


   </div>


  <div class="product-body">
         <p class="caption"> PERFUME </p>

        <h1>Gabrielle Essence Eau De Parfum</h1>

      <p>   A floral, solar and voluptuous interpretation composed by Olivier Polge, 
       Perfumer-Creator for the House of CHANEL.</p>

       <h3> $149.99
       <span class="price-slash" > $169.99  </span> </h3>

  
     

      <button class="addCart-btn" > 
        <img src="./images/icon-cart.svg" class="icon" alt="cart icon" /> 
        Add to Cart
      </button>
    </div>

     </section>

 
 </div>

</main>
  
  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="#"> Prime Craft team</a>.
  </footer>
</body>
</html>
